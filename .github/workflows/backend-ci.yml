name: Backend CI

on:
  push:
    branches: [main, jonas]
    paths: [backend/**, backend.tests/**, backend.integration-tests/**]
  pull_request:
    branches: [main, jonas]
    paths: [backend/**, backend.tests/**, backend.integration-tests/**]

permissions:
  contents: read
  packages: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore backend.tests/
          dotnet restore backend.integration-tests/

      - name: Run unit tests
        run: dotnet test backend.tests/ --no-restore --logger "trx;LogFileName=unit-test-results.trx" --results-directory ./test-results

      - name: Run integration tests
        run: dotnet test backend.integration-tests/ --no-restore --logger "trx;LogFileName=integration-test-results.trx" --results-directory ./test-results

      - name: Report unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Tests
          reporter: dotnet-trx
          path: test-results/unit-test-results.trx

      - name: Report integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Integration Tests
          reporter: dotnet-trx
          path: test-results/integration-test-results.trx

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
